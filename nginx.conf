# =============================================================================
# Nginx Configuration - Serves API Key Panel
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index panel.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
