# ---------------------------------------------------------------------------
# LITELLM CORE SETTINGS
# ---------------------------------------------------------------------------
litellm_settings:
  set_verbose: False
  json_logs: True

  cache: True
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD

  success_callback: []
  failure_callback: []
  service_callback: []

  budget_duration: "30d"
  default_max_internal_user_budget: 10.0
  default_max_end_user_budget: 10.0

# ---------------------------------------------------------------------------
# ROUTER & FALLBACK
# ---------------------------------------------------------------------------
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 30
  allowed_fails: 3
  cooldown_time: 300
  retry_after: 5

  context_window_fallbacks:
    - groq-llama-3.3-70b:
      - gemini-2.5-flash
      - github-llama-3.3-70b

  model_group_fallbacks:
    - groq-llama-3.3-70b:
      - openrouter-llama-3.3-70b
      - github-llama-3.3-70b
      - cf-llama-3.3-70b
    - gemini-2.5-flash:
      - gemini-3.1-flash-lite
      - groq-llama-3.3-70b
    - cerebras-llama-3.1-8b:
      - groq-llama-3.3-70b
      - cf-llama-3.3-70b

# ---------------------------------------------------------------------------
# GENERAL / ADMIN
# ---------------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: True
  proxy_batch_write_at: 60
  proxy_model_list: []
  alerting: []
  alert_types: []
  ui_username: "admin"
  ui_password: os.environ/LITELLM_MASTER_KEY
